services:
  db:
    image: postgres:18.4
    container_name: fernando_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432"
    volumes:
      - psql_data:/var/lib/postgresql/data

  backe_end:
    build: .
    restart: always
    container_name: fernando_backend
    ports:
      - "5012:5000"
    env_file:
    - path: .env
      required: false

volumes:
  psql_data: